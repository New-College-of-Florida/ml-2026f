<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Dictionaries to a POS Tagger</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d252d;
      --muted: #68727b;
      --paper: #f3f0e8;
      --panel: #fffdf8;
      --line: #d8d1c4;
      --blue: #315f78;
      --blue-soft: #deebf1;
      --green: #28705f;
      --green-soft: #dcece5;
      --gold: #a87520;
      --gold-soft: #f6e9c9;
      --red: #a44439;
      --code: #18232d;
      --code-muted: #8395a3;
      --code-text: #e9eef1;
      --code-active: #304757;
      font-family: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 4%, rgb(49 95 120 / 9%), transparent 30rem),
        var(--paper);
    }

    button { font: inherit; }

    main {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0 44px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 850px;
      margin-bottom: 8px;
      font-size: clamp(2.2rem, 5vw, 4.4rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.96;
    }

    h1 em { color: var(--blue); font-weight: inherit; }

    .lede {
      max-width: 790px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .key-hint {
      flex: 0 0 auto;
      margin: 0 0 4px;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.76rem;
      text-align: right;
    }

    kbd {
      display: inline-block;
      min-width: 1.8rem;
      padding: 3px 6px;
      border: 1px solid #bcb4a6;
      border-bottom-width: 2px;
      border-radius: 5px;
      color: var(--ink);
      background: #fffdf8;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: center;
    }

    .walkthrough {
      display: grid;
      grid-template-columns: minmax(440px, 0.9fr) minmax(560px, 1.1fr);
      height: clamp(650px, 74vh, 820px);
      overflow: hidden;
      border: 1px solid #c9c1b3;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 55px rgb(48 42 33 / 11%);
    }

    .code-side {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code);
      color: var(--code-text);
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      min-height: 58px;
      padding: 12px 18px;
      border-bottom: 1px solid rgb(255 255 255 / 10%);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .panel-heading strong { font-size: 0.86rem; letter-spacing: 0.04em; }
    .panel-heading span { color: var(--code-muted); font-size: 0.72rem; }

    .code-window {
      min-height: 0;
      overflow: auto;
      padding: 14px 0 50vh;
      scrollbar-color: #526472 transparent;
    }

    .code-line {
      display: grid;
      grid-template-columns: 3.1rem minmax(max-content, 1fr);
      min-height: 25px;
      border-left: 4px solid transparent;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      white-space: pre;
    }

    .code-line .number {
      padding-right: 11px;
      color: #677b89;
      text-align: right;
      user-select: none;
    }

    .code-line .source { padding: 2px 14px 2px 10px; }

    .code-line.active {
      border-left-color: #e4b656;
      background: var(--code-active);
      box-shadow: inset 0 1px rgb(255 255 255 / 5%), inset 0 -1px rgb(0 0 0 / 20%);
    }

    .code-line.active .number { color: #f1c86f; }
    .code-line.blank { min-height: 13px; }
    .token-keyword { color: #e397bd; }
    .token-string { color: #badf9b; }
    .token-number { color: #efc879; }
    .token-comment { color: #8495a2; font-style: italic; }
    .token-call { color: #89c8e8; }

    .code-footer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid rgb(255 255 255 / 10%);
      background: #141e26;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .nav-button {
      min-width: 84px;
      padding: 8px 12px;
      border: 1px solid #536775;
      border-radius: 8px;
      color: var(--code-text);
      background: transparent;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .nav-button:hover:not(:disabled) { border-color: #e4b656; color: #f1c86f; }
    .nav-button:disabled { cursor: not-allowed; opacity: 0.35; }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #31404a;
    }

    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: #e4b656; transition: width 160ms ease; }

    .visual-side {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(rgb(255 253 248 / 88%), rgb(255 253 248 / 88%)),
        repeating-linear-gradient(0deg, transparent 0 34px, rgb(49 95 120 / 4%) 34px 35px);
    }

    .visual-heading {
      min-height: 58px;
      padding: 12px clamp(20px, 4vw, 36px);
      border-bottom: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .visual-heading .eyebrow {
      margin-bottom: 2px;
      color: var(--blue);
      font-size: 0.67rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .visual-heading strong { font-size: 0.93rem; }

    .visual-content {
      overflow: auto;
      padding: clamp(24px, 5vw, 48px);
    }

    .scene { min-height: 100%; }

    .scene h2 {
      margin-bottom: 12px;
      font-size: clamp(1.7rem, 3vw, 2.7rem);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.05;
    }

    .scene > p, .scene-copy {
      max-width: 760px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.58;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      box-shadow: 0 7px 22px rgb(50 43 32 / 5%);
    }

    .card.active { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .card h3 { margin-bottom: 8px; font-size: 1.05rem; }
    .card p:last-child { margin-bottom: 0; }

    .metric {
      display: block;
      margin-bottom: 5px;
      color: var(--blue);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 1.75rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .small {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .pipeline {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin: 28px 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .pipeline .step {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      font-size: 0.8rem;
    }

    .pipeline .step.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); font-weight: 700; }
    .pipeline .arrow { color: #9b9388; }

    .sentence {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
      margin: 26px 0;
    }

    .word-token {
      min-width: 62px;
      padding: 10px 11px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      text-align: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .word-token strong { display: block; font-size: 0.9rem; }
    .word-token span { color: var(--muted); font-size: 0.66rem; }
    .word-token.current { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 3px rgb(168 117 32 / 12%); }
    .word-token.context { border-color: var(--blue); background: var(--blue-soft); }
    .word-token.next { border-color: var(--green); background: var(--green-soft); }

    .dict-wrap {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 0.8fr);
      gap: 18px;
      align-items: start;
    }

    .dictionary {
      padding: 17px 20px;
      border-radius: 12px;
      color: #e9eef1;
      background: #202d37;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.79rem;
      line-height: 1.65;
    }

    .dict-row { display: flex; justify-content: space-between; gap: 16px; }
    .dict-row.new { color: #f2cb72; animation: flash 420ms ease; }
    .dict-row.skipped { color: #8da0ad; text-decoration: line-through; opacity: 0.68; }
    @keyframes flash { 0% { background: rgb(242 203 114 / 25%); } }

    .explain-box {
      padding: 16px;
      border-left: 4px solid var(--gold);
      border-radius: 5px 10px 10px 5px;
      background: #fbf2dc;
      line-height: 1.5;
    }

    .explain-box strong { color: #765314; }
    .condition { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.82rem; }

    .matrix-scroll { overflow-x: auto; margin-top: 20px; padding-bottom: 8px; }

    .matrix {
      border-collapse: separate;
      border-spacing: 3px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.68rem;
    }

    .matrix th { max-width: 88px; padding: 4px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
    .matrix th.column { height: 90px; vertical-align: bottom; writing-mode: vertical-rl; transform: rotate(180deg); }
    .matrix td { width: 25px; min-width: 25px; height: 25px; border-radius: 4px; background: #ece8df; text-align: center; }
    .matrix td.one { color: white; background: var(--blue); font-weight: 700; }
    .matrix td.ellipsis, .matrix th.ellipsis { background: transparent; color: var(--muted); }

    .csr {
      display: grid;
      gap: 9px;
      margin-top: 22px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7f4ed;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
    }

    .csr-row { display: grid; grid-template-columns: 7.5rem 1fr; gap: 10px; }
    .csr-row strong { color: var(--blue); }
    .array-values { overflow-wrap: anywhere; }

    .estimator-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .estimator {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    .estimator.selected { border-color: var(--green); background: var(--green-soft); box-shadow: 0 0 0 3px rgb(40 112 95 / 10%); }
    .estimator code { color: var(--blue); font-size: 0.78rem; overflow-wrap: anywhere; }

    .fit-visual {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-top: 34px;
    }

    .fit-block {
      padding: 18px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      text-align: center;
    }

    .fit-block strong { display: block; margin-bottom: 4px; color: var(--blue); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.3rem; }
    .fit-arrow { color: var(--gold); font-size: 1.6rem; }

    .accuracy-display {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 30px;
      align-items: center;
      margin-top: 28px;
    }

    .accuracy-ring {
      display: grid;
      width: 180px;
      height: 180px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--green) 0 94.52%, #e6e1d7 94.52% 100%);
    }

    .accuracy-ring div {
      display: grid;
      width: 132px;
      height: 132px;
      place-items: center;
      border-radius: 50%;
      background: var(--panel);
      color: var(--green);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 2rem;
      font-weight: 750;
    }

    .tag-table { width: 100%; border-collapse: collapse; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.8rem; }
    .tag-table th, .tag-table td { padding: 8px 9px; border-bottom: 1px solid var(--line); text-align: left; }
    .tag-table .wrong { color: var(--red); font-weight: 700; }
    .tag-table .right { color: var(--green); font-weight: 700; }

    @media (max-width: 980px) {
      header { display: block; }
      .key-hint { margin-top: 12px; text-align: left; }
      .walkthrough { height: auto; grid-template-columns: 1fr; }
      .code-side { height: 600px; }
      .code-window { max-height: 530px; padding-bottom: 45vh; }
      .visual-side { min-height: 650px; }
    }

    @media (max-width: 620px) {
      main { width: min(100% - 16px, 1500px); padding-top: 20px; }
      .cards, .estimator-grid, .dict-wrap { grid-template-columns: 1fr; }
      .fit-visual { grid-template-columns: 1fr; }
      .fit-arrow { transform: rotate(90deg); text-align: center; }
      .accuracy-display { grid-template-columns: 1fr; }
      .code-line { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>From dictionaries to a <em>POS tagger</em></h1>
        <p class="lede">Walk through a complete scikit-learn program one line at a time. The code stays fixed on the left while its data structures come alive on the right.</p>
      </div>
      <p class="key-hint"><kbd>↓</kbd> next line &nbsp; <kbd>↑</kbd> previous line</p>
    </header>

    <section class="walkthrough">
      <div class="code-side">
        <div class="panel-heading">
          <strong>scikit-tagging-simple.py</strong>
          <span id="line-status">line 1</span>
        </div>
        <div class="code-window" id="code-window" aria-label="Python source code"></div>
        <div class="code-footer">
          <button class="nav-button" id="previous" type="button">↑ Previous</button>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
          <button class="nav-button" id="next" type="button">Next ↓</button>
        </div>
      </div>

      <div class="visual-side">
        <div class="visual-heading">
          <div class="eyebrow" id="stage-label">Data</div>
          <strong id="stage-title">Load the corpus</strong>
        </div>
        <div class="visual-content" id="visual-content" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
